# search space adapted from https://github.com/autogluon/tabarena/blob/main/packages/tabarena/src/tabarena/models/catboost/hpo.py
iterations:
  type: categorical
  choices: [10000]

learning_rate:
  type: float
  low: 0.01
  high: 0.08
  log: true

bootstrap_type:
  type: categorical
  choices: ['Bernoulli']

subsample:
  type: float
  low: 0.7
  high: 1.0

grow_policy:
  type: categorical
  choices: ['SymmetricTree', 'Depthwise']

depth:
  type: int
  low: 3
  high: 7


l2_leaf_reg:
  type: float
  low: 1.0
  high: 30.0
  log: true

leaf_estimation_iterations:
  type: int
  low: 1
  high: 5
  log: true

min_data_in_leaf:
  type: int
  low: 1
  high: 64
  log: true

random_strength:
  type: float
  low: 0.5
  high: 20.0
  log: true

one_hot_max_size:
  type: int
  low: 8
  high: 100
  log: true

model_size_reg:
  type: float
  low: 0.1
  high: 2.0
  log: true

max_ctr_complexity:
  type: int
  low: 2
  high: 5

boosting_type:
  type: categorical
  choices: ['Plain']

max_bin:
  type: categorical
  choices: [254]

auto_class_weights:
  type: categorical
  choices: ["None", "Balanced", "SqrtBalanced"]
