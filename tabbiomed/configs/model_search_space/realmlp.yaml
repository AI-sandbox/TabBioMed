# search space adapted from https://github.com/autogluon/tabarena/blob/main/packages/tabarena/src/tabarena/models/realmlp/hpo.py
config_type:
  type: categorical
  choices: ["default", "large"]

n_hidden_layers:
  type: int
  low: 2
  high: 4

hidden_sizes:
  type: categorical
  choices: ["rectangular"]
  hpo_only: true

hidden_width:
  type: categorical
  choices: [256, 384, 512]

p_drop:
  type: float
  low: 0.0
  high: 0.5

act:
  type: categorical
  choices: ["mish"]
  hpo_only: true

plr_sigma:
  type: float
  low: 0.01
  high: 50.0
  log: true

sq_mom:
  type: float
  low: 0.005
  high: 0.05
  log: true
  transform: one_minus

plr_lr_factor:
  type: float
  low: 0.05
  high: 0.3
  log: true

scale_lr_factor:
  type: float
  low: 2.0
  high: 10.0
  log: true

first_layer_lr_factor:
  type: float
  low: 0.3
  high: 1.5
  log: true

ls_eps_sched:
  type: categorical
  choices: ["coslog4"]
  hpo_only: true

ls_eps:
  type: float
  low: 0.005
  high: 0.1
  log: true

p_drop_sched:
  type: categorical
  choices: ["flat_cos"]

lr:
  type: float
  low: 0.02
  high: 0.3
  log: true

wd:
  type: float
  low: 0.001
  high: 0.05
  log: true

use_ls:
  type: categorical
  choices: [false, true]

max_one_hot_cat_size:
  type: float
  low: 4.0
  high: 33.0
  log: true
  transform: floor

embedding_size:
  type: categorical
  choices: [4, 8, 16]

n_ens:
  type: int
  low: 8
  high: 8

ens_av_before_softmax:
  type: categorical
  choices: [false]

plr_hidden_1:
  type: conditional
  depends_on: config_type
  default: 16
  large: [8, 16, 32, 64]

plr_hidden_2:
  type: conditional
  depends_on: config_type
  default: 4
  large: [8, 16, 32, 64]

n_epochs:
  type: conditional
  depends_on: config_type
  default: 256
  large: [256, 512]

use_early_stopping:
  type: conditional
  depends_on: config_type
  default: false
  large: true

early_stopping_additive_patience:
  type: categorical
  choices: [40]

early_stopping_multiplicative_patience:
  type: categorical
  choices: [3]

default_hyperparameters:
  type: categorical
  choices: ["td"]

bool_to_cat:
  type: categorical
  choices: [true]

impute_bool:
  type: categorical
  choices: [false]

name_categories:
  type: categorical
  choices: [true]
