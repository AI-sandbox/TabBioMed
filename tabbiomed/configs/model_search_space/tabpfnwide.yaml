# TabPFN-Wide uses a TabPFNv2 backbone and Wide-specific checkpoints.
# Preprocessing HPO choices follow TabArena's TabPFNv2.5 space, adapted to Wide's tabpfn version.
# Source: https://github.com/autogluon/tabarena/blob/main/packages/tabarena/src/tabarena/models/tabpfnv2_5/hpo.py
zip_model_path:
  type: categorical
  choices:
    - "tabpfn-wide-v2-1.5k.pt"
    - "tabpfn-wide-v2-1.5k-nocat.pt"
    - "tabpfn-wide-v2-5k.pt"
    - "tabpfn-wide-v2-5k-nocat.pt"
    - "tabpfn-wide-v2-8k.pt"
    - "tabpfn-wide-v2-8k-nocat.pt"

n_estimators:
  type: categorical
  choices: [1, 4, 8, 16]

softmax_temperature:
  type: categorical
  choices: [0.25, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5]

balance_probabilities:
  type: categorical
  choices: [true, false]

average_before_softmax:
  type: categorical
  choices: [true, false]

inference_config/OUTLIER_REMOVAL_STD:
  type: categorical
  choices: [3, 6, 12]

preprocessing/scaling:
  type: categorical
  choices:
    - null
    - ["none"]
    - ["quantile_uni_coarse"]
    - ["quantile_norm_coarse"]
    - ["kdi_uni"]
    - ["kdi_alpha_0.3"]
    - ["kdi_alpha_3.0"]
    - ["safepower", "quantile_uni"]
    - ["none", "quantile_uni_coarse"]
    - ["squashing_scaler_default", "quantile_uni_coarse"]
    - ["squashing_scaler_default"]

preprocessing/categoricals:
  type: categorical
  choices: ["numeric", "onehot", "none"]

preprocessing/append_original:
  type: categorical
  choices: ["auto", false]

preprocessing/global:
  type: categorical
  choices: [null, "svd", "svd_quarter_components"]

base_tabpfn_path:
  type: categorical
  choices: ["tabpfn-v2-classifier-v2_default.ckpt"]
